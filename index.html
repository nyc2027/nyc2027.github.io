<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13243b" media="(prefers-color-scheme: dark)">
<title>뉴욕 겨울 동선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --navy: #1f3a5f;
    --red: #c0392b;
    --band: #1f3a5f;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #e8edf3;
    --ink: #13213a;
    --muted: #5b697d;
    --line: #d8dfe8;
    --lodge: #1f3a5f;
    --accent-text: #c0392b;
    --focus: #c0392b;
    --shadow: 0 1px 2px rgba(15, 30, 55, .06), 0 6px 20px rgba(15, 30, 55, .09);
    --f-head: "Space Grotesk", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --f-body: "Inter", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --band: #13243b;
      --bg: #0c1420;
      --surface: #152234;
      --surface-2: #1b2b40;
      --ink: #e6ecf4;
      --muted: #95a5ba;
      --line: #27394f;
      --lodge: #2d5283;
      --accent-text: #ff8576;
      --focus: #ff8576;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }

  /* 날짜별 색: --c(채움, 고정) / --c-light(다크모드용 밝은 톤) → --ct(글자·선) */
  .daycolor { --ct: var(--c); }
  @media (prefers-color-scheme: dark) { .daycolor { --ct: var(--c-light); } }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 var(--f-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  /* ---------- 레이아웃: 모바일 우선 (헤더 / 탭 / 지도 / 리스트) ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto clamp(220px, 42dvh, 540px) minmax(0, 1fr);
    grid-template-areas: "head" "tabs" "map" "panel";
  }

  /* ---------- 헤더 ---------- */
  .masthead {
    grid-area: head;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 8px;
    background: var(--band);
    color: #fff;
  }
  .masthead::before { /* 눈 내리는 밤 느낌의 점 패턴 */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(rgba(255, 255, 255, .18) 1px, transparent 1.6px),
      radial-gradient(rgba(255, 255, 255, .09) 1px, transparent 1.6px);
    background-size: 22px 22px, 13px 13px;
    background-position: 0 0, 7px 9px;
    -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 95%);
    mask-image: linear-gradient(100deg, transparent 35%, #000 95%);
  }
  .masthead > * { position: relative; }
  .eyebrow {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    font: 600 10.5px/1 var(--f-head);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .7);
  }
  .eyebrow i { width: 7px; height: 7px; border-radius: 1px; background: var(--red); }
  .masthead h1 {
    margin: 6px 0 0;
    font: 700 26px/1 var(--f-head);
    letter-spacing: -.025em;
  }
  .range {
    margin: 0;
    text-align: right;
    font: 500 11.5px/1.5 var(--f-head);
    letter-spacing: .02em;
    color: rgba(255, 255, 255, .62);
    font-variant-numeric: tabular-nums;
  }
  .range b { color: #fff; font-weight: 600; }

  /* ---------- 날짜 탭 (가로 스크롤) ---------- */
  .tabs {
    grid-area: tabs;
    position: relative;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    padding: 6px 16px 14px;
    background: var(--band);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1 0 46px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 8px 4px;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 12px;
    background: rgba(255, 255, 255, .05);
    color: rgba(255, 255, 255, .86);
    cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .tab:hover { background: rgba(255, 255, 255, .11); }
  .tab-dow { font-size: 11px; font-weight: 500; line-height: 1; opacity: .7; }
  .tab-date {
    font: 600 19px/1 var(--f-head);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  .tab-bar {
    width: 14px;
    height: 3px;
    border-radius: 3px;
    background: var(--c-light);
    transition: width .2s;
  }
  .tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
  }
  .tab[aria-selected="true"] .tab-bar { width: 24px; background: var(--c); }
  @media (prefers-color-scheme: dark) {
    .tab[aria-selected="true"] { background: #e6ecf4; color: #13213a; }
  }
  .tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .tab-today {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff6b5b;
  }
  .tab-sep {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 1px;
    border-left: 1px dashed rgba(255, 255, 255, .22);
    font: 600 9px/1 var(--f-head);
    letter-spacing: .14em;
    color: rgba(255, 255, 255, .45);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  /* ---------- 지도 ---------- */
  .mapwrap {
    grid-area: map;
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: var(--surface-2);
  }
  .mapcanvas { position: absolute; inset: 0; }
  .map-loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: var(--muted);
  }
  .map-ctl {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 5;
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .map-ctl button {
    border: 0;
    background: none;
    padding: 7px 12px;
    border-radius: 999px;
    font: 600 12.5px/1 var(--f-body);
    color: var(--muted);
    cursor: pointer;
  }
  .map-ctl button:hover { color: var(--ink); }
  .map-ctl button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  @media (prefers-color-scheme: dark) {
    .map-ctl button[aria-pressed="true"] { background: #e6ecf4; color: #13213a; }
  }
  .map-note {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 28px;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 8px 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: var(--shadow);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .map-note p { margin: 0; flex: 1; word-break: keep-all; }
  .map-note b { color: var(--ink); }
  .map-note code {
    font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .note-x {
    flex: none;
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .note-x:hover { background: var(--surface-2); }

  /* 지도 마커 (Google AdvancedMarker 콘텐츠) */
  .mk {
    position: relative;
    width: max-content;
    padding-bottom: 7px;
    cursor: pointer;
    transform-origin: 50% 100%;
    transition: transform .2s cubic-bezier(.3, 1.5, .6, 1);
    filter: drop-shadow(0 2px 3px rgba(8, 20, 40, .38));
  }
  .mk.is-active { transform: scale(1.22); }
  .mk-pin {
    position: relative;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 2px solid #fff;
    border-radius: 50%;
    background: var(--c);
    color: #fff;
    font: 700 14px/1 var(--f-head);
  }
  .mk-pin::after { /* 아래쪽 꼭지 */
    content: "";
    position: absolute;
    left: 50%;
    top: calc(100% + 1px);
    margin-left: -6px;
    border: solid transparent;
    border-width: 8px 6px 0;
    border-top-color: #fff;
  }
  .mk-lodge .mk-pin { width: 32px; height: 32px; border-radius: 10px; background: var(--lodge); }
  .mk-lodge .mk-pin svg { width: 17px; height: 17px; }
  .mk-badge {
    position: absolute;
    top: -8px;
    right: -10px;
    min-width: 19px;
    height: 19px;
    padding: 0 4px;
    border: 2px solid #fff;
    border-radius: 10px;
    background: var(--b);
    color: #fff;
    font: 700 11px/15px var(--f-head);
    text-align: center;
  }
  .mk-tag {
    position: absolute;
    left: calc(100% + 5px);
    top: 7px;
    white-space: nowrap;
    padding: 4px 7px;
    border-radius: 999px;
    background: #fff;
    color: #1f3a5f;
    font: 600 11px/1 var(--f-body);
  }
  /* "보이면 먹기" 참고 핀 (동선 비연결) */
  .mk-near { filter: drop-shadow(0 1px 2px rgba(8, 20, 40, .3)); }
  .mk-near .mk-pin {
    width: 25px;
    height: 25px;
    background: #fff;
    border: 2px dashed var(--c);
    font-size: 14px;
  }
  .mk-near .mk-pin::after { border-top-color: #fff; }
  .mk-near .mk-tag {
    top: 4px;
    padding: 3px 6px;
    border: 1px dashed var(--c);
    font-size: 10px;
  }

  /* InfoWindow */
  .gm-style .gm-style-iw-c {
    background: var(--surface) !important;
    border-radius: 14px !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25) !important;
  }
  .gm-style .gm-style-iw-tc::after { background: var(--surface) !important; }
  .gm-style .gm-style-iw-d { color: var(--ink); }
  .gm-style .gm-ui-hover-effect > span { background-color: var(--muted) !important; }
  .iw-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
    font: 700 15px/1.3 var(--f-head);
    color: var(--ink);
    word-break: keep-all;
  }
  .iw-num {
    flex: none;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--c);
    color: #fff;
    font: 700 12px/1 var(--f-head);
  }
  .iw-num.is-lodge { border-radius: 7px; background: var(--lodge); }
  .iw-num svg { width: 13px; height: 13px; }
  .iw { max-width: 250px; padding: 0 2px 6px; font: 13.5px/1.5 var(--f-body); color: var(--ink); }
  .iw p { margin: 0; }
  .iw-time { font: 600 13px/1.4 var(--f-head); color: var(--ct); letter-spacing: .02em; }
  .iw-memo { margin-top: 2px !important; color: var(--muted); word-break: keep-all; }
  .iw-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .iw-links a {
    padding: 7px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink);
    font: 600 12px/1 var(--f-body);
    text-decoration: none;
  }
  .iw-links a:hover { background: var(--line); }

  /* 간이 지도(키 없을 때) */
  #schematic svg { display: block; width: 100%; height: 100%; }
  .sc-bg { fill: var(--surface-2); }
  .sc-dot { fill: var(--line); }
  .sc-casing { fill: none; stroke: var(--surface); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .sc-route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .sc-dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 6; opacity: .75; }
  .sc-mk { cursor: pointer; }
  .sc-in { transform-box: fill-box; transform-origin: center; transition: transform .2s cubic-bezier(.3, 1.5, .6, 1); }
  .sc-mk.is-active .sc-in { transform: scale(1.25); }
  .sc-mk.is-off { opacity: .7; }
  .sc-pin { stroke: #fff; stroke-width: 2.5; }
  .sc-lodge-box { fill: var(--lodge); stroke: #fff; stroke-width: 2.5; }
  .sc-num { fill: #fff; font: 700 13px var(--f-head); text-anchor: middle; }
  .sc-badge-num { fill: #fff; font: 700 10px var(--f-head); text-anchor: middle; }
  .sc-near-pin { fill: var(--surface); stroke-width: 2; stroke-dasharray: 3 2.5; }
  .sc-near-emo { font-size: 12px; text-anchor: middle; }
  .sc-near .sc-label { fill: var(--muted); }
  .sc-label {
    font: 600 11.5px var(--f-body);
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--surface-2);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .sc-mk.is-active .sc-label { font-weight: 700; }
  .sc-scale path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .sc-scale text { fill: var(--muted); font: 500 10.5px var(--f-head); text-anchor: middle; }

  /* ---------- 리스트 패널 ---------- */
  .panel {
    grid-area: panel;
    position: relative;
    z-index: 2;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin-top: -16px;
    padding: 22px 16px calc(28px + env(safe-area-inset-bottom));
    border-radius: 18px 18px 0 0;
    background: var(--bg);
    box-shadow: 0 -8px 24px rgba(10, 25, 45, .14);
    outline: none;
  }
  .day-kicker {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    font: 600 12px/1 var(--f-head);
    letter-spacing: .04em;
    color: var(--muted);
  }
  .day-kicker b {
    padding: 4px 7px;
    border-radius: 6px;
    background: var(--c);
    color: #fff;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .day-head h2 {
    margin: 10px 0 0;
    font: 700 23px/1.25 var(--f-head);
    letter-spacing: -.015em;
    word-break: keep-all;
  }
  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 4px 8px;
    border: 1px solid currentColor;
    border-radius: 999px;
    color: var(--accent-text);
    font: 600 11px/1 var(--f-body);
    font-style: normal;
    vertical-align: 4px;
  }
  .day-stats {
    margin: 8px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .day-stats span + span::before { content: "·"; margin: 0 8px; opacity: .6; }

  .stops { list-style: none; margin: 16px 0 0; padding: 0; }
  .row { position: relative; }
  .row::before { /* 타임라인 레일 */
    content: "";
    position: absolute;
    left: 24px;
    top: 44px;
    bottom: -10px;
    width: 2px;
    margin-left: -1px;
    border-radius: 2px;
    background: color-mix(in srgb, var(--ct) 40%, transparent);
  }
  .row.dash::before {
    background: repeating-linear-gradient(to bottom,
      color-mix(in srgb, var(--muted) 60%, transparent) 0 4px, transparent 4px 8px);
  }
  .row:last-child::before { display: none; }
  .row-btn {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    column-gap: 12px;
    width: 100%;
    padding: 10px 12px 10px 8px;
    border: 0;
    border-radius: 14px;
    background: none;
    text-align: left;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .row-btn:hover { background: var(--surface-2); }
  .row-btn:focus-visible, .map-ctl button:focus-visible, .note-x:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .row.is-active .row-btn { background: var(--surface); box-shadow: var(--shadow); }
  .num {
    position: relative;
    z-index: 1;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--c);
    color: #fff;
    font: 700 14px/1 var(--f-head);
    box-shadow: 0 0 0 4px var(--bg);
  }
  .num.is-lodge { border-radius: 10px; background: var(--lodge); }
  .num svg { width: 16px; height: 16px; }
  .row.is-active .num { box-shadow: 0 0 0 4px var(--surface); }
  .row-body { min-width: 0; padding-top: 1px; }
  .row-time {
    display: block;
    font: 600 12.5px/1.2 var(--f-head);
    letter-spacing: .03em;
    color: var(--ct);
    font-variant-numeric: tabular-nums;
  }
  .row-name {
    display: block;
    margin-top: 3px;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
    word-break: keep-all;
  }
  .row-memo {
    display: block;
    margin-top: 2px;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--muted);
    word-break: keep-all;
  }
  .row-lodge .row-time { color: var(--muted); }
  .row-lodge .row-name { font-size: 14px; font-weight: 500; color: var(--muted); }
  /* ---------- 이동 구간 (지하철 타는 법) ---------- */
  .leg { padding: 2px 0 8px 52px; }
  .leg-plain {
    padding: 2px 0;
    font: 500 11.5px/1.3 var(--f-head);
    letter-spacing: .01em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .leg-plain.is-loading { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .leg-sum {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 8px;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    text-align: left;
    font: 500 12.5px/1.3 var(--f-body);
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .leg-sum:hover { border-color: color-mix(in srgb, var(--ct) 55%, var(--line)); }
  .leg-sum:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .leg-sum b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .leg.is-open .leg-sum { border-color: color-mix(in srgb, var(--ct) 55%, var(--line)); box-shadow: var(--shadow); }
  .lg-ico { display: grid; color: var(--muted); }
  .lg-ico svg, .st-ico > svg { width: 16px; height: 16px; }
  .lg-lines { display: inline-flex; align-items: center; gap: 3px; }
  .lg-arrow { font-style: normal; color: var(--muted); margin: 0 1px; }
  .leg-meta { color: var(--muted); font-size: 12px; }
  .lg-warn {
    display: grid;
    place-items: center;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #d69e2e;
    color: #fff;
    font: 700 11px/1 var(--f-head);
  }
  .chev { margin-left: auto; display: grid; color: var(--muted); transition: transform .2s; }
  .chev svg { width: 16px; height: 16px; }
  .leg.is-open .chev { transform: rotate(180deg); }
  .leg-detail {
    margin-top: 8px;
    padding: 12px 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    font-size: 13px;
    line-height: 1.45;
  }

  const mqWide = matchMedia('(min-width: 960px)');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const behavior = reduceMotion ? 'auto' : 'smooth';
  const isDark = () => mqDark.matches;

  const HOUSE_PATH = 'M12 3 2 11.4l1.3 1.5L5 11.4V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.6l1.7 1.5L22 11.4z';
  const HOUSE = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="${HOUSE_PATH}"/></svg>`;
  const FULL_DOW = { 일: '일요일', 월: '월요일', 화: '화요일', 수: '수요일', 목: '목요일', 금: '금요일', 토: '토요일' };

  function km(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = k => (k < 1 ? `${Math.round(k * 100) * 10} m` : `${k.toFixed(1)} km`);
  const colorVars = day => `--c:${day.color[0]};--c-light:${day.color[1]}`;

  // 리스트에 표시할 행: (출발 숙소) → 방문지들 → (복귀 숙소)
  function buildRows(day) {
    const lodgeRow = (ref, role) => {
      const L = LODGES[ref.id];
      return { key: 'l-' + ref.id, kind: 'lodge', role, id: ref.id, label: ref.label, short: L.short, lat: L.lat, lng: L.lng };
    };
    const rows = [];
    if (day.from) rows.push(lodgeRow(day.from, 'from'));
    day.stops.forEach((s, i) => rows.push({ key: 's' + i, kind: 'stop', n: i + 1, ...s }));
    if (day.to) rows.push(lodgeRow(day.to, 'to'));
    return rows;
  }

  // "보이면 먹기" — 동선과 무관한 참고 먹거리 (메모 + 지도 점선 핀)
  function nearbyHtml(day) {
    if (!day.nearby || !day.nearby.length) return '';
    const items = day.nearby.map(n =>
      `<li><span class="near-emo">${n.emoji || '📍'}</span><span class="near-txt"><b>${esc(n.name)}</b>${n.memo ? `<span>${esc(n.memo)}</span>` : ''}</span></li>`
    ).join('');
    return `<div class="near-note">
      <p class="near-head">👀 보이면 먹기 <em>동선과 무관 · 지도엔 점선 핀</em></p>
      <ul class="near-list">${items}</ul></div>`;
  }

  // 그날 지도에 찍을 숙소 마커 (출발·복귀 숙소가 같으면 하나)
  function dayLodges(day) {
    const out = new Map();
    if (day.from) out.set(day.from.id, day.from.tag || '숙소');
    if (day.to && !out.has(day.to.id)) out.set(day.to.id, day.to.tag || '숙소');
    if (day.from && day.to && day.from.id === day.to.id) out.set(day.from.id, '숙소');
    return [...out].map(([id, tag]) => ({ id, tag, ...LODGES[id] }));
  }

  function infoFor(day, key) {
    const rows = buildRows(day);
    const idx = rows.findIndex(r => r.key === key);
    if (idx < 0) return null;
    const r = rows[idx];
    if (r.kind === 'stop') {
      return { kind: 'stop', n: r.n, home: !!r.home, name: r.name, time: r.t, memo: r.memo,
        lat: r.lat, lng: r.lng, prev: idx > 0 ? rows[idx - 1] : null, day };
    }
    const L = LODGES[r.id];
    return { kind: 'lodge', name: L.name, time: '숙소', memo: L.stay, lat: L.lat, lng: L.lng, prev: null, day };
  }

  const mapsUrl = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  const dirUrl = (a, b) => `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=transit`;

  /* ------------------------------------------------------------------
   * 이동 구간(leg)과 실제 경로 (Google Routes API)
   * ------------------------------------------------------------------ */
  const WALK_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2a5.1 5.1 0 0 1-4.4-2.5l-1-1.6a2 2 0 0 0-1.7-1c-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>';
  const CAR_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18.9 6c-.2-.6-.8-1-1.4-1h-11c-.7 0-1.2.4-1.4 1L3 12v8c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1h12v1c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-8l-2.1-6ZM6.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3ZM5 11l1.5-4.5h11L19 11H5Z"/></svg>';
  const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const pad2 = n => String(n).padStart(2, '0');
  const nyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const nyTime = d => (d instanceof Date && !isNaN(d) ? nyFmt.format(d) : '');
  const fmtMs = ms => {
    const m = Math.max(1, Math.round(ms / 60000));
    return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`;
  };
  const fmtM = m => fmtDist(m / 1000);
  const safeColor = (c, fallback) => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c : fallback);

  // 여행 날짜 + 시각(뉴욕 12~1월은 EST, UTC-5) → Date
  function tripTime(day, t, isBack) {
    const [y, m, d] = (day.svcDate || `${day.y}-${pad2(day.m)}-${pad2(day.d)}`).split('-').map(Number);
    let ms = Date.UTC(y, m - 1, d);
    if (isBack && t < day.stops[day.stops.length - 1].t) ms += 864e5; // 자정 넘어 복귀
    return new Date(`${new Date(ms).toISOString().slice(0, 10)}T${t}:00-05:00`);
  }

  // 리스트의 행 사이마다 이동 구간 하나. 1.25km 이하는 도보, 그 외는 지하철. 장소에 via가 있으면 그 수단.
  function buildLegs(day) {
    const rows = buildRows(day);
    const legs = [];
    for (let j = 0; j < rows.length - 1; j++) {
      const a = rows[j], b = rows[j + 1];
      const mode = b.via || (km(a, b) <= 1.25 ? 'WALKING' : 'TRANSIT');
      let timeType = null, time = null;
      if (mode === 'TRANSIT') {
        if (b.kind === 'stop') { timeType = 'arr'; time = tripTime(day, b.t); }
        else if (day.back) { timeType = 'dep'; time = tripTime(day, day.back, true); }
      }
      const leg = { j, a, b, mode, timeType, time, through: b.through || null, note: b.legNote || null,
        lodge: a.kind === 'lodge' || b.kind === 'lodge', svcNote: day.svcNote || null, altLeg: null };
      leg.sig = legSig(leg);
      if (b.alt) {
        leg.altLeg = { ...leg, mode: b.alt, anyTransit: true, timeType: 'dep', time: tripTime(day, a.t || '12:00'), through: null };
        leg.altLeg.sig = legSig(leg.altLeg);
      }
      legs.push(leg);
    }
    return legs;
  }
  function legSig(l) {
    return [l.mode, l.anyTransit ? 'any' : 'sub', `${l.a.lat},${l.a.lng}`, `${l.b.lat},${l.b.lng}`,
      l.timeType || '', l.time ? l.time.toISOString() : '', JSON.stringify(l.through || '')].join('|');
  }

  const r5 = n => Math.round(n * 1e5) / 1e5;
  const num = v => (typeof v === 'function' ? v() : v);
  const toPts = arr => (arr || []).map(p => [r5(num(p.lat)), r5(num(p.lng))]);
  const stopOf = s => ({
    name: (s && s.name) || '',
    lat: s && s.location ? r5(num(s.location.lat)) : null,
    lng: s && s.location ? r5(num(s.location.lng)) : null,
  });

  // Routes API 결과 → 화면에서 쓰는 단순한 구조 (localStorage 캐시용)
  function normalize(route, leg, timed) {
    const L = route.legs[0];
    const segs = [];
    let cur = null;
    for (const st of L.steps || []) {
      const td = st.transitDetails;
      if (td) {
        cur = null;
        const line = td.transitLine || {};
        const veh = line.vehicle || {};
        const dep = nyTime(td.departureTime);
        segs.push({
          kind: 'transit', path: toPts(st.path),
          short: line.shortName || '', name: line.name || '', color: line.color || '', text: line.textColor || '',
          veh: veh.vehicleType || '', agency: (line.agencies && line.agencies[0] && line.agencies[0].name) || '',
          headsign: td.headsign || '', stops: td.stopCount || 0,
          from: stopOf(td.departureStop), to: stopOf(td.arrivalStop),
          depH: dep ? Number(dep.slice(0, 2)) : null,
          ms: st.staticDurationMillis || 0,
          headway: td.headwayMillis ? Math.round(td.headwayMillis / 60000) : 0,
        });
      } else {
        const kind = leg.mode === 'DRIVING' ? 'drive' : 'walk';
        if (!cur) { cur = { kind, path: [], m: 0, ms: 0, instr: [] }; segs.push(cur); }
        const p = toPts(st.path);
        cur.path.push(...(cur.path.length ? p.slice(1) : p));
        cur.m += st.distanceMeters || 0;
        cur.ms += st.staticDurationMillis || 0;
        const ins = (st.instructions || '').trim();
        if (ins) cur.instr.push(ins.replace(/\s*\n\s*/g, ' · '));
      }
    }
    segs.forEach((s, i) => {
      if (s.kind !== 'walk') return;
      const prev = segs[i - 1], next = segs[i + 1];
      s.to = next && next.kind === 'transit' ? next.from.name : null;
      s.transfer = !!(prev && prev.kind === 'transit' && next && next.kind === 'transit');
    });
    return {
      ok: true, at: Date.now(), mode: leg.mode, timed,
      ms: route.durationMillis || 0, m: route.distanceMeters || 0,
      fare: (route.localizedValues && route.localizedValues.transitFare) || '',
      segs,
    };
  }

  const Routes = {
    lib: null, mem: new Map(), inflight: new Map(), disabled: false,
    VER: 'nyc-route-v1', TTL: 7 * 864e5,

    peek(leg) {
      if (!leg) return null;
      if (this.mem.has(leg.sig)) return this.mem.get(leg.sig);
      try {
        const raw = localStorage.getItem(`${this.VER}:${leg.sig}`);
        const o = raw && JSON.parse(raw);
        if (o && o.ok && Date.now() - o.at < this.TTL) { this.mem.set(leg.sig, o); return o; }
      } catch (e) { /* 무시 */ }
      return null;
    },

    get(leg) {
      const hit = this.peek(leg);
      if (hit) return Promise.resolve(hit);
      if (this.inflight.has(leg.sig)) return this.inflight.get(leg.sig);
      const p = this.compute(leg).then(res => {
        this.inflight.delete(leg.sig);
        this.mem.set(leg.sig, res);
        if (res.ok) { try { localStorage.setItem(`${this.VER}:${leg.sig}`, JSON.stringify(res)); } catch (e) { /* 무시 */ } }
        return res;
      });
      this.inflight.set(leg.sig, p);
      return p;
    },

    async compute(leg) {
      try {
        if (!this.lib) this.lib = await google.maps.importLibrary('routes');
      } catch (e) { return { ok: false, err: 'routes 라이브러리 로드 실패' }; }
      const base = {
        origin: { lat: leg.a.lat, lng: leg.a.lng },
        destination: { lat: leg.b.lat, lng: leg.b.lng },
        travelMode: leg.mode,
        language: 'en', region: 'us', // 역·노선 이름을 현지 표지판과 같은 영어로
        units: google.maps.UnitSystem.METRIC,
        fields: ['path', 'legs', 'durationMillis', 'distanceMeters', 'localizedValues'],
      };
      if (leg.through) base.intermediates = leg.through.map(([lat, lng]) => ({ location: { lat, lng }, via: true }));

      // 시도 순서: 지하철만+여행 시각 → 전체+여행 시각 → 지하철만+현재 → 전체+현재
      const tKey = leg.timeType === 'arr' ? 'arrivalTime' : 'departureTime';
      const subwayOnly = leg.mode === 'TRANSIT' && !leg.anyTransit;
      const SUB = { allowedTransitModes: ['SUBWAY'] };
      const tries = [];
      if (leg.mode === 'TRANSIT' && leg.time) {
        if (subwayOnly) tries.push([{ ...base, transitPreference: SUB, [tKey]: leg.time }, true]);
        tries.push([{ ...base, [tKey]: leg.time }, true]);
      }
      if (subwayOnly) tries.push([{ ...base, transitPreference: SUB }, false]);
      tries.push([base, false]);

      let err = null;
      for (const [req, timed] of tries) {
        try {
          const { routes } = await this.lib.Route.computeRoutes(req);
          if (routes && routes.length) return normalize(routes[0], leg, timed);
        } catch (e) {
          err = e;
          if (/PERMISSION_DENIED|SERVICE_BLOCKED|has not been used|is disabled|REQUEST_DENIED|API_KEY/i.test(String(e && e.message))) {
            this.disabled = true;
            console.warn('Routes API 사용 불가:', e);
            break;
          }
        }
      }
      return { ok: false, err: String((err && err.message) || '경로 없음') };
    },
  };

  /* 노선 운행 시간 (뉴욕 지하철, MTA 운행 안내 기준. 심야 = 대략 0시~6시) */
  const SUBWAY_24H = new Set(['1', '2', '4', '6', '7', 'A', 'D', 'E', 'F', 'G', 'J', 'L', 'N', 'Q', 'SI', 'SIR']);
  const SUBWAY_PART = {
    '3': ['24시간 · 심야엔 구간 단축', '심야엔 할렘–Times Sq-42 St 구간만 운행 → 그 남쪽은 1 이용'],
    '5': ['심야 맨해튼 미운행', '심야엔 맨해튼을 지나지 않아요 → 4 이용'],
    'B': ['평일 주간만 운행', '주말·공휴일·심야엔 운행 안 함 → 같은 6 Av 구간은 D·F 이용'],
    'C': ['심야 미운행', '심야엔 A가 C 역에 모두 정차'],
    'M': ['심야 맨해튼 미운행', '심야엔 맨해튼 구간 운행 안 함, 주말엔 구간 변경이 잦음 → F 이용'],
    'R': ['심야 맨해튼·퀸스 미운행', '심야엔 맨해튼은 N, 퀸스는 E·F가 대신 정차'],
    'W': ['평일 주간만 운행', '주말·공휴일·심야엔 운행 안 함 → N·R 이용'],
    'Z': ['평일 출퇴근 시간만', '그 외 시간엔 J 이용 (24시간)'],
  };
  const VEH_KO = { SUBWAY: '지하철', BUS: '버스', INTERCITY_BUS: '버스', TROLLEYBUS: '버스', TRAM: '경전철', LIGHT_RAIL: '경전철', MONORAIL: '경전철', FERRY: '페리' };
  const vehKo = v => VEH_KO[v] || (/RAIL|TRAIN/.test(v || '') ? '기차' : '대중교통');
  const isExpress = s => s.veh === 'SUBWAY' && /^[0-9A-Z]X$/i.test(s.short);
  const lineCode = s => (isExpress(s) ? s.short[0] : s.short).toUpperCase();
  const isAirTrain = s => /airtrain/i.test(`${s.name} ${s.agency}`);

  function lineLabel(s) {
    if (isAirTrain(s)) return 'JFK 에어트레인';
    return s.short ? `${vehKo(s.veh)} ${lineCode(s)}${isExpress(s) ? ' 급행' : ''}` : `${vehKo(s.veh)} · ${s.name}`;
  }

  // 첫차·막차 안내
  function svcInfo(s) {
    if (isAirTrain(s)) return { cls: 'ok', text: '24시간 운행 · 첫차·막차 없음', note: '지하철과 요금 따로' };
    if (s.veh !== 'SUBWAY') return { cls: 'warn', text: `${vehKo(s.veh)} 첫차·막차 확인 필요`, note: '노선마다 운행 시간이 달라요' };
    const code = lineCode(s);
    if (isExpress(s)) return { cls: 'warn', text: '급행은 평일 출퇴근 시간만', note: `그 외 시간엔 같은 승강장의 ${code} 완행 이용 (24시간 운행)` };
    if (code === 'S') {
      return /42|grand central|times sq/i.test(s.name)
        ? { cls: 'warn', text: '심야 미운행', note: '심야엔 운행 안 함 → 7 이용' }
        : { cls: 'ok', text: '24시간 운행 · 첫차·막차 없음', note: '' };
    }
    if (SUBWAY_24H.has(code)) return { cls: 'ok', text: '24시간 운행 · 첫차·막차 없음', note: '심야(0~6시경)엔 약 20분 간격' };
    const p = SUBWAY_PART[code];
    return p ? { cls: 'warn', text: p[0], note: p[1] } : { cls: 'warn', text: '첫차·막차 확인 필요', note: '' };
  }

  function bullet(s) {
    const label = isAirTrain(s) ? 'AirTrain' : (s.short ? lineCode(s) : vehKo(s.veh));
    const cls = s.veh === 'SUBWAY' ? (isExpress(s) ? ' is-x' : (label.length > 2 ? ' is-wide' : '')) : ' is-wide is-sq';
    return `<span class="bullet${cls}" style="--lc:${safeColor(s.color, '#5b697d')};--lt:${safeColor(s.text, '#ffffff')}" title="${esc(lineLabel(s))}"><span>${esc(label)}</span></span>`;
  }

  const gmDir = (leg, mode) => {
    const tm = { WALKING: 'walking', TRANSIT: 'transit', DRIVING: 'driving' }[mode] || 'transit';
    const wp = leg.through && mode === 'WALKING' ? `&waypoints=${encodeURIComponent(leg.through.map(p => p.join(',')).join('|'))}` : '';
    return `https://www.google.com/maps/dir/?api=1&origin=${leg.a.lat},${leg.a.lng}&destination=${leg.b.lat},${leg.b.lng}&travelmode=${tm}${wp}`;
  };
  const legDest = leg => (leg.b.kind === 'lodge' ? LODGES[leg.b.id].short : leg.b.short);

  function stepsHtml(res, destName) {
    const segs = res.segs;
    return `<ol class="steps">${segs.map((s, i) => {
      if (s.kind === 'transit') {
        const info = svcInfo(s);
        const sub = [
          s.short && s.name && !isAirTrain(s) ? esc(s.name) : '',
          s.headway ? `배차 약 ${s.headway}분` : '',
          s.depH != null && s.depH < 6 ? '심야 시간대' : '',
        ].filter(Boolean).join(' · ');
        return `<li class="st"><span class="st-ico">${bullet(s)}</span><div class="st-body">
          <p class="st-title"><b>${esc(lineLabel(s))}</b>${s.headsign ? ` <span class="st-dir">${esc(s.headsign)} 방면</span>` : ''}</p>
          <p class="st-route"><b>${esc(s.from.name)}</b> 승차 → ${s.stops ? `${s.stops}개 역 · ` : ''}${fmtMs(s.ms)} → <b>${esc(s.to.name)}</b> 하차</p>
          ${sub ? `<p class="st-sub">${sub}</p>` : ''}
          <p class="svc ${info.cls}">${esc(info.text)}</p>${info.note ? `<p class="st-sub">${esc(info.note)}</p>` : ''}
        </div></li>`;
      }
      if (s.kind !== 'walk' || s.m < 1) return '';
      const target = s.to ? `${esc(s.to)} 역까지` : (i === segs.length - 1 ? `${esc(destName)}까지` : '');
      const doors = s.instr
        .filter(x => /^Take (entrance|exit)\s+\S/i.test(x))
        .map(x => x.replace(/^Take entrance\s*/i, '입구 · ').replace(/^Take exit\s*/i, '출구 · '));
      return `<li class="st st-walk"><span class="st-ico">${WALK_ICO}</span><div class="st-body">
        <p class="st-title"><b>${s.transfer ? '환승 도보' : '도보'} ${fmtMs(s.ms)}</b> <span class="st-dir">${fmtM(s.m)}${target ? ` · ${target}` : ''}</span></p>
        ${doors.map(x => `<p class="st-sub">${esc(x)}</p>`).join('')}
      </div></li>`;
    }).join('')}</ol>`;
  }

  function legSummary(leg, res) {
    const tr = res.segs.filter(s => s.kind === 'transit');
    if (res.mode === 'DRIVING') {
      return `<span class="lg-ico">${CAR_ICO}</span><b>차량 ${fmtMs(res.ms)}</b><span class="leg-meta">${fmtM(res.m)}${leg.note ? ` · ${esc(leg.note)}` : ''}</span>`;
    }
    if (!tr.length) {
      return `<span class="lg-ico">${WALK_ICO}</span><b>도보 ${fmtMs(res.ms)}</b><span class="leg-meta">${fmtM(res.m)}${leg.note ? ` · ${esc(leg.note)}` : ''}</span>`;
    }
    const walkMs = res.segs.reduce((a, s) => a + (s.kind === 'walk' ? s.ms : 0), 0);
    const warn = tr.some(s => svcInfo(s).cls !== 'ok');
    const meta = [leg.lodge ? '숙소 이동' : '', walkMs >= 60000 ? `도보 ${fmtMs(walkMs)}` : ''].filter(Boolean).join(' · ');
    return `<span class="lg-lines">${tr.map(bullet).join('<i class="lg-arrow" aria-hidden="true">›</i>')}</span><b>${fmtMs(res.ms)}</b>${meta ? `<span class="leg-meta">${meta}</span>` : ''}${warn ? '<span class="lg-warn" title="운행 시간 주의">!</span>' : ''}`;
  }

  // Google 요금에는 에어트레인(약 $8.75)이 들어갈 때도, 빠질 때도 있어 금액으로 구분
  function fareText(r) {
    if (!r.segs.some(s => s.kind === 'transit' && isAirTrain(s))) return `요금 ${r.fare}`;
    const n = parseFloat(String(r.fare).replace(/[^0-9.]/g, ''));
    return `요금 ${r.fare}${n >= 8 ? ' (에어트레인 포함)' : ' + 에어트레인 별도'}`;
  }

  function legDetail(leg, res) {
    const dest = legDest(leg);
    const hasTransit = res.segs.some(s => s.kind === 'transit');
    const basis = [];
    let body = '';
    if (hasTransit) {
      basis.push(res.timed && leg.time ? `${nyTime(leg.time)} ${leg.timeType === 'arr' ? '도착' : '출발'} 기준` : '현재 시간표 기준');
      if (res.timed && leg.svcNote) basis.push(leg.svcNote);
      if (res.fare) basis.push(fareText(res));
      body = stepsHtml(res, dest);
    } else if (res.mode === 'DRIVING') {
      basis.push(`약 ${fmtMs(res.ms)} · ${fmtM(res.m)}`, '교통 상황에 따라 달라져요');
    } else {
      basis.push(`도보 약 ${fmtMs(res.ms)} · ${fmtM(res.m)}`);
      if (leg.note) basis.push(leg.note);
      const turns = res.segs.flatMap(s => s.instr || []);
      body = turns.length ? `<ol class="turns">${turns.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : '';
    }
    let alt = '';
    const ar = leg.altLeg && Routes.peek(leg.altLeg);
    if (ar && ar.ok) {
      const ab = [ar.timed ? `${nyTime(leg.altLeg.time)} 출발 기준` : '현재 시간표 기준'];
      if (ar.fare) ab.push(fareText(ar));
      alt = `<div class="leg-alt"><p class="leg-alt-title">대중교통으로 가려면 · 약 ${fmtMs(ar.ms)}</p>
        <p class="leg-basis">${ab.map(esc).join(' · ')}</p>${stepsHtml(ar, dest)}
        <a class="leg-link" href="${esc(gmDir(leg.altLeg, 'TRANSIT'))}" target="_blank" rel="noopener">대중교통 길안내 열기</a></div>`;
    }
    return `<p class="leg-basis">${basis.map(esc).join(' · ')}</p>${body}
      <a class="leg-link" href="${esc(gmDir(leg, res.mode))}" target="_blank" rel="noopener">Google 지도 앱에서 길안내</a>${alt}`;
  }

  function legHtml(leg) {
    const live = view === GMap && !Routes.disabled;
    const res = live ? Routes.peek(leg) : null;
    const straight = `${leg.lodge ? '숙소 이동 · ' : ''}직선 ${fmtDist(km(leg.a, leg.b))}`;
    if (!live) return `<div class="leg-plain">${straight}</div>`;
    if (!res) {
      const failed = Routes.mem.has(leg.sig) && !Routes.inflight.has(leg.sig);
      return `<div class="leg-plain${failed ? '' : ' is-loading'}">${straight} · ${failed ? '경로 정보 없음' : '경로 계산 중…'}</div>`;
    }
    if (!res.ok) return `<div class="leg-plain">${straight} · 경로 정보 없음</div>`;
    const open = state.openLegs.has(leg.j);
    return `<button type="button" class="leg-sum" data-leg="${leg.j}" aria-expanded="${open}">${legSummary(leg, res)}<span class="chev">${CHEV}</span></button>
      ${open ? `<div class="leg-detail">${legDetail(leg, res)}</div>` : ''}`;
  }

  function updateLegUI(leg) {
    const el = document.getElementById(`leg-${leg.j}`);
    if (!el) return;
    el.innerHTML = legHtml(leg);
    el.classList.toggle('is-open', state.openLegs.has(leg.j));
  }
  function refreshLegs(day) {
    buildLegs(day).forEach(updateLegUI);
    updateDayLines(day);
  }

  // 그날 타는 노선 요약 + 첫차·막차 주의
  function updateDayLines(day) {
    const el = document.getElementById('dayLines');
    if (!el) return;
    if (view === GMap && Routes.disabled) {
      el.innerHTML = '<p class="routes-off">실제 경로를 불러오지 못했어요. Google Cloud에서 <b>Routes API</b>를 사용 설정하고, API 키 제한에 Routes API를 추가했는지 확인하세요.</p>';
      el.hidden = false;
      return;
    }
    const seen = new Map();
    buildLegs(day).forEach(l => {
      const r = view === GMap ? Routes.peek(l) : null;
      if (r && r.ok) r.segs.forEach(s => { if (s.kind === 'transit') seen.set(`${s.veh}|${s.short}|${s.name}`, s); });
    });
    if (!seen.size) { el.hidden = true; el.innerHTML = ''; return; }
    const list = [...seen.values()];
    const warns = list.filter(s => svcInfo(s).cls !== 'ok');
    el.innerHTML = `<span class="dl-label">이날 타는 노선</span><span class="dl-bullets">${list.map(bullet).join('')}</span>
      ${warns.length
        ? warns.map(s => `<span class="svc warn">${esc(lineLabel(s))} · ${esc(svcInfo(s).text)}</span>`).join('')
        : '<span class="svc ok">모두 24시간 운행 · 막차 걱정 없음</span>'}`;
    el.hidden = false;
  }

  function loadRoutes(day) {
    if (view !== GMap || Routes.disabled) return;
    buildLegs(day).forEach(leg => {
      [leg, leg.altLeg].filter(Boolean).forEach(l => {
        if (Routes.peek(l)) return;
        Routes.get(l).then(() => onRoute(day, leg));
      });
    });
  }
  function onRoute(day, leg) {
    if (DAYS[state.idx] !== day) return;
    if (Routes.disabled) { refreshLegs(day); return; }
    if (view === GMap && GMap.day === day) GMap.drawLeg(leg, Routes.peek(leg));
    updateLegUI(leg);
    updateDayLines(day);
  }

  function toggleLeg(j) {
    const day = DAYS[state.idx];
    const leg = buildLegs(day)[j];
    if (!leg) return;
    if (state.openLegs.has(j)) {
      state.openLegs.delete(j);
    } else {
      state.openLegs.add(j);
      if (view === GMap) { select(null); GMap.focusLeg(leg); }
    }
    updateLegUI(leg);
  }

  /* ------------------------------------------------------------------
   * 상태
   * ------------------------------------------------------------------ */
  const state = { idx: 0, active: null, withLodge: false, openLegs: new Set() };
  try { state.withLodge = localStorage.getItem('nyc-trip-withLodge') === '1'; } catch (e) { /* 무시 */ }

  const tabsEl = $('#tabs');
  const panel = $('#panel');
  let view = null; // GMap 또는 Schematic

  /* ------------------------------------------------------------------
   * 날짜 탭
   * ------------------------------------------------------------------ */
  function todayIdx() {
    const n = new Date();
    return DAYS.findIndex(d => d.y === n.getFullYear() && d.m === n.getMonth() + 1 && d.d === n.getDate());
  }
  function hashIdx() {
    const m = /^#d([1-7])$/.exec(location.hash);
    return m ? Number(m[1]) - 1 : -1;
  }

  function renderTabs() {
    const today = todayIdx();
    tabsEl.innerHTML = DAYS.map((d, i) => `
      ${i > 0 && d.y !== DAYS[i - 1].y ? `<span class="tab-sep" aria-hidden="true">${d.y}</span>` : ''}
      <button type="button" class="tab daycolor" role="tab" id="tab-${i}" data-i="${i}"
        aria-controls="panel" aria-selected="false" tabindex="-1" style="${colorVars(d)}"
        aria-label="${d.m}월 ${d.d}일 ${FULL_DOW[d.dow]} · ${esc(d.title)}${i === today ? ' (오늘)' : ''}">
        <span class="tab-dow">${d.dow}</span>
        <span class="tab-date">${d.d}</span>
        <span class="tab-bar"></span>
        ${i === today ? '<span class="tab-today"></span>' : ''}
      </button>`).join('');
  }

  function centerTab(i) {
    const t = $(`#tab-${i}`);
    if (!t || tabsEl.scrollWidth <= tabsEl.clientWidth) return;
    tabsEl.scrollTo({ left: t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2, behavior });
  }

  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    const i = Number(t.dataset.i);
    if (i === state.idx) { select(null); view && view.fit(); } // 같은 탭 다시 누르면 전체 동선으로
    else selectDay(i);
  });
  tabsEl.addEventListener('keydown', e => {
    const n = DAYS.length;
    const map = { ArrowRight: state.idx + 1, ArrowLeft: state.idx - 1, Home: 0, End: n - 1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    selectDay((map[e.key] + n) % n, { focusTab: true });
  });

  /* ------------------------------------------------------------------
   * 리스트 패널
   * ------------------------------------------------------------------ */
  function renderPanel(day, i) {
    const rows = buildRows(day);
    let total = 0;
    for (let j = 1; j < day.stops.length; j++) total += km(day.stops[j - 1], day.stops[j]);

    const legs = buildLegs(day);
    const rowHtml = rows.map((r, j) => {
      const next = rows[j + 1];
      const dash = !!next && (r.kind === 'lodge' || next.kind === 'lodge');
      const leg = next ? `<div class="leg${state.openLegs.has(j) ? ' is-open' : ''}" id="leg-${j}">${legHtml(legs[j])}</div>` : '';
      if (r.kind === 'lodge') {
        const backNote = r.role === 'to' && day.back ? `<span class="row-memo">${day.back} 출발 기준으로 경로 계산</span>` : '';
        return `<li class="row row-lodge${dash ? ' dash' : ''}" data-key="${r.key}">
          <button type="button" class="row-btn" data-key="${r.key}">
            <span class="num is-lodge">${HOUSE}</span>
            <span class="row-body"><span class="row-time">숙소</span><span class="row-name">${esc(r.label)}</span>${backNote}</span>
          </button>${leg}</li>`;
      }
      return `<li class="row${dash ? ' dash' : ''}" data-key="${r.key}">
        <button type="button" class="row-btn" data-key="${r.key}">
          <span class="num${r.home ? ' is-lodge' : ''}">${r.n}</span>
          <span class="row-body">
            <span class="row-time">${r.t}</span>
            <span class="row-name">${esc(r.name)}</span>
            ${r.memo ? `<span class="row-memo">${esc(r.memo)}</span>` : ''}
          </span>
        </button>${leg}</li>`;
    }).join('');

    panel.style.cssText = colorVars(day);
    panel.setAttribute('aria-labelledby', `tab-${i}`);
    panel.innerHTML = `
      <header class="day-head">
        <p class="day-kicker"><b>Day ${i + 1}</b><span>${day.m}월 ${day.d}일 ${FULL_DOW[day.dow]}</span></p>
        <h2>${esc(day.title)}${day.badge ? `<em class="badge">${esc(day.badge)}</em>` : ''}</h2>
        <p class="day-stats">
          <span>방문 ${day.stops.length}곳</span>
          <span>직선 동선 ${fmtDist(total)}</span>
          <span>베이스 ${esc(day.base)}</span>
        </p>
        <div class="day-lines" id="dayLines" hidden></div>
      </header>
      <ol class="stops">${rowHtml}</ol>
      ${nearbyHtml(day)}
      <p class="panel-foot">장소를 누르면 지도에서 확대되고, 장소 사이의 이동 칸을 누르면 지하철 타는 법이 펼쳐집니다.
        지도 선은 실제 경로(지하철은 노선 색, 도보는 점선)이고, 경로를 못 불러오면 직선으로 보여요.
        시간은 일정의 도착 시각 기준으로 계산한 참고용이며 실시간 시간표는 아닙니다.</p>
      <details class="tips">
        <summary>뉴욕 지하철 타는 법</summary>
        <ul>
          <li>개찰구에서 컨택리스 카드나 휴대폰(애플페이 등)을 태그하면 됩니다(OMNY). 요금은 각 구간의 ‘요금’을 참고하세요.</li>
          <li>같은 카드·휴대폰으로 계속 태그하세요. 2시간 안 지하철↔버스 환승이 무료이고, 7일 안에 12번 결제하면 그 뒤는 무료(요금 상한)입니다.</li>
          <li>입구가 Uptown(북쪽)·Downtown(남쪽) 방면으로 나뉜 역이 많아요. 들어가기 전에 입구 위 표지를 확인하세요.</li>
          <li>같은 승강장에 급행(Express)과 완행(Local)이 함께 서요. 열차의 노선 기호와 ‘○○ 방면’을 꼭 확인하세요.</li>
          <li>심야(0~6시경)엔 배차가 약 20분으로 길어지고, 주말·심야엔 공사로 노선이 바뀌는 일이 잦아요. 역 안내문이나 MTA 앱을 확인하세요.</li>
        </ul>
      </details>`;
    panel.scrollTop = 0;
    updateDayLines(day);
  }

  panel.addEventListener('click', e => {
    const ls = e.target.closest('.leg-sum');
    if (ls) { toggleLeg(Number(ls.dataset.leg)); return; }
    const b = e.target.closest('.row-btn');
    if (b) select(b.dataset.key);
  });

  function scrollRowIntoView(key) {
    const row = panel.querySelector(`.row[data-key="${key}"]`);
    if (!row) return;
    const r = row.getBoundingClientRect(), p = panel.getBoundingClientRect();
    if (r.top < p.top + 8 || r.bottom > p.bottom - 8) {
      panel.scrollBy({ top: r.top - p.top - 16, behavior });
    }
  }

  /* ------------------------------------------------------------------
   * 선택 흐름
   * ------------------------------------------------------------------ */
  function selectDay(i, { hash = true, focusTab = false } = {}) {
    state.idx = i;
    state.active = null;
    state.openLegs = new Set();
    const day = DAYS[i];
    tabsEl.querySelectorAll('.tab').forEach(t => {
      const on = Number(t.dataset.i) === i;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      if (on && focusTab) t.focus();
    });
    centerTab(i);
    renderPanel(day, i);
    if (view) { view.render(day); view.fit(); }
    loadRoutes(day);
    if (hash) history.replaceState(null, '', `#d${i + 1}`);
    document.title = `${day.m}/${day.d} ${day.title} · 뉴욕 동선`;
  }

  function select(key, { fromMap = false } = {}) {
    state.active = key;
    panel.querySelectorAll('.row').forEach(r => r.classList.toggle('is-active', r.dataset.key === key));
    if (key && fromMap) scrollRowIntoView(key);
    if (!view) return;
    view.highlight(key);
    if (key) view.focus(key, { zoom: !fromMap });
    else view.blur();
  }

  function setWithLodge(v) {
    state.withLodge = v;
    $('#fitRoute').setAttribute('aria-pressed', String(!v));
    $('#fitAll').setAttribute('aria-pressed', String(v));
    try { localStorage.setItem('nyc-trip-withLodge', v ? '1' : '0'); } catch (e) { /* 무시 */ }
    if (view) view.fit();
  }
  $('#fitRoute').addEventListener('click', () => setWithLodge(false));
  $('#fitAll').addEventListener('click', () => setWithLodge(true));

  /* ------------------------------------------------------------------
   * Google 지도
   * ------------------------------------------------------------------ */
  function stopPin(n, color) {
    const el = document.createElement('div');
    el.className = 'mk';
    el.style.setProperty('--c', color);
    el.innerHTML = `<div class="mk-pin">${n}</div>`;
    return el;
  }
  function lodgePin(tag, n, badgeColor) {
    const el = document.createElement('div');
    el.className = 'mk mk-lodge';
    if (badgeColor) el.style.setProperty('--b', badgeColor);
    el.innerHTML = `<div class="mk-pin">${HOUSE}${n ? `<b class="mk-badge">${n}</b>` : ''}</div>${tag ? `<span class="mk-tag">${esc(tag)}</span>` : ''}`;
    return el;
  }
  function nearbyPin(nb, color) {
    const el = document.createElement('div');
    el.className = 'mk mk-near';
    el.style.setProperty('--c', color);
    el.innerHTML = `<div class="mk-pin">${nb.emoji || '📍'}</div><span class="mk-tag">${esc(nb.name)}</span>`;
    return el;
  }

  function iwHead(info) {
    const el = document.createElement('div');
    el.className = 'iw-head daycolor';
    el.style.cssText = colorVars(info.day);
    const icon = info.kind === 'lodge' || info.home
      ? `<span class="iw-num is-lodge">${HOUSE}</span>`
      : `<span class="iw-num">${info.n}</span>`;
    el.innerHTML = `${icon}<span>${esc(info.name)}</span>`;
    return el;
  }
  function iwBody(info) {
    const el = document.createElement('div');
    el.className = 'iw daycolor';
    el.style.cssText = colorVars(info.day);
    const links = [`<a href="${mapsUrl(info)}" target="_blank" rel="noopener">지도 앱에서 열기</a>`];
    if (info.prev) links.push(`<a href="${dirUrl(info.prev, info)}" target="_blank" rel="noopener">${esc(info.prev.short)}에서 오는 길</a>`);
    el.innerHTML = `
      <p class="iw-time">${esc(info.time)}</p>
      ${info.memo ? `<p class="iw-memo">${esc(info.memo)}</p>` : ''}
      <div class="iw-links">${links.join('')}</div>`;
    return el;
  }

  const GMap = {
    map: null, iw: null, AME: null, core: null, Polyline: null, day: null, legOv: new Map(), marks: new Map(), lastMarkerClick: 0,

    async init(el) {
      const [core, maps, marker] = await Promise.all([
        google.maps.importLibrary('core'),
        google.maps.importLibrary('maps'),
        google.maps.importLibrary('marker'),
      ]);
      this.core = core;
      this.Polyline = maps.Polyline;
      this.AME = marker.AdvancedMarkerElement;
      const opts = {
        mapId: GOOGLE_MAP_ID,
        center: { lat: 40.742, lng: -73.97 },
        zoom: 12,
        disableDefaultUI: true,
        zoomControl: true,
        zoomControlOptions: { position: core.ControlPosition.RIGHT_TOP },
        gestureHandling: 'greedy',
        clickableIcons: false,
      };
      const CS = core.ColorScheme || google.maps.ColorScheme;
      if (CS) opts.colorScheme = CS.FOLLOW_SYSTEM; // 시스템 다크모드 따라가기
      this.map = new maps.Map(el, opts);
      this.iw = new maps.InfoWindow({ maxWidth: 300 });
      this.iw.addListener('closeclick', () => select(null));
      this.map.addListener('click', () => {
        if (Date.now() - this.lastMarkerClick < 400) return; // 마커 클릭이 지도 클릭으로 번지는 경우 무시
        select(null);
      });
    },

    clear() {
      if (this.iw) this.iw.close();
      this.legOv.forEach(list => list.forEach(o => this.drop(o)));
      this.legOv.clear();
      this.marks.forEach(r => { r.m.map = null; });
      this.marks.clear();
    },

    drop(o) {
      if (this.AME && o instanceof this.AME) o.map = null;
      else o.setMap(null);
    },

    mark(key, p, el, z, title) {
      const pos = { lat: p.lat, lng: p.lng };
      const m = new this.AME({ map: this.map, position: pos, content: el, zIndex: z, title, gmpClickable: true });
      m.addEventListener('gmp-click', () => {
        this.lastMarkerClick = Date.now();
        select(key, { fromMap: true });
      });
      this.marks.set(key, { m, el, z, pos });
    },

    render(day) {
      this.clear();
      this.day = day;
      const S = day.stops;
      buildLegs(day).forEach(leg => this.drawLeg(leg, Routes.peek(leg)));

      dayLodges(day).forEach(l => this.mark('l-' + l.id, l, lodgePin(l.tag), 50, `${l.name} (숙소)`));
      S.forEach((s, i) => {
        const el = s.home ? lodgePin(null, i + 1, day.color[0]) : stopPin(i + 1, day.color[0]);
        this.mark('s' + i, s, el, 100 + i, `${i + 1}. ${s.name}`);
      });
      // "보이면 먹기" 참고 핀 — 경로선에 연결하지 않고 위치만 표시 (클릭 선택 없음)
      (day.nearby || []).forEach((nb, i) => {
        const el = nearbyPin(nb, day.color[0]);
        const pos = { lat: nb.lat, lng: nb.lng };
        const m = new this.AME({ map: this.map, position: pos, content: el, zIndex: 30 + i, title: `${nb.name} · ${nb.memo || '보이면 먹기'}` });
        this.marks.set('n' + i, { m, el, z: 30 + i, pos });
      });
    },

    // 이동 구간: 실제 경로가 있으면 지하철은 노선 색 실선, 도보는 점선. 없으면 직선(숙소 구간은 점선).
    drawLeg(leg, res) {
      (this.legOv.get(leg.j) || []).forEach(o => this.drop(o));
      const ov = [];
      this.legOv.set(leg.j, ov);
      const dark = isDark();
      const c = this.day.color[dark ? 1 : 0];
      const casing = dark ? '#0c1420' : '#ffffff';
      const line = opts => ov.push(new this.Polyline({ clickable: false, map: this.map, ...opts }));
      const dotted = (path, color, scale) => line({
        path, strokeOpacity: 0, zIndex: 4,
        icons: [{ icon: { path: this.core.SymbolPath.CIRCLE, fillColor: color, fillOpacity: 1, strokeOpacity: 0, scale }, offset: '0', repeat: `${Math.round(scale * 4)}px` }],
      });
      const A = { lat: leg.a.lat, lng: leg.a.lng }, B = { lat: leg.b.lat, lng: leg.b.lng };

      if (!res || !res.ok) {
        if (leg.lodge) {
          line({ path: [A, B], strokeOpacity: 0, zIndex: 1,
            icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: .85, strokeColor: dark ? '#a9bbd3' : '#1f3a5f', strokeWeight: 2.5, scale: 3 }, offset: '0', repeat: '11px' }] });
        } else {
          line({ path: [A, B], strokeColor: casing, strokeOpacity: .95, strokeWeight: 8, zIndex: 2 });
          line({ path: [A, B], strokeColor: c, strokeOpacity: 1, strokeWeight: 4, zIndex: 3,
            icons: [{ icon: { path: this.core.SymbolPath.FORWARD_CLOSED_ARROW, scale: 2.6, strokeColor: c, strokeWeight: 1, fillColor: c, fillOpacity: 1 }, offset: '55%' }] });
        }
        return;
      }

      const op = leg.lodge ? .8 : 1;
      const walkOnly = !res.segs.some(s => s.kind === 'transit');
      res.segs.forEach(s => {
        const path = s.path.map(([lat, lng]) => ({ lat, lng }));
        if (path.length < 2) return;
        if (s.kind === 'transit') {
          line({ path, strokeColor: casing, strokeOpacity: .95 * op, strokeWeight: 9, zIndex: 5 });
          line({ path, strokeColor: safeColor(s.color, c), strokeOpacity: op, strokeWeight: 5, zIndex: 6 });
          this.station(ov, s.from, s, '승차');
          this.station(ov, s.to, s, '하차');
        } else if (s.kind === 'drive') {
          line({ path, strokeColor: casing, strokeOpacity: .95, strokeWeight: 8, zIndex: 5 });
          line({ path, strokeColor: c, strokeOpacity: 1, strokeWeight: 4.5, zIndex: 6 });
        } else {
          dotted(path, walkOnly ? c : (dark ? '#c3cedb' : '#4a5a70'), walkOnly ? 2.6 : 2);
        }
      });
    },

    // 승차·하차 역 표시
    station(ov, st, s, verb) {
      if (st.lat == null || st.lng == null) return;
      const el = document.createElement('div');
      el.className = 'st-dot';
      el.style.setProperty('--lc', safeColor(s.color, '#5b697d'));
      ov.push(new this.AME({ map: this.map, position: { lat: st.lat, lng: st.lng }, content: el, zIndex: 40, title: `${st.name} · ${lineLabel(s)} ${verb}` }));
    },

    focusLeg(leg) {
      const res = Routes.peek(leg);
      const b = new this.core.LatLngBounds();
      b.extend({ lat: leg.a.lat, lng: leg.a.lng });
      b.extend({ lat: leg.b.lat, lng: leg.b.lng });
      if (res && res.ok) res.segs.forEach(s => s.path.forEach(([lat, lng]) => b.extend({ lat, lng })));
      this.map.fitBounds(b, mqWide.matches ? { top: 80, right: 70, bottom: 50, left: 70 } : { top: 60, right: 30, bottom: 36, left: 30 });
      this.core.event.addListenerOnce(this.map, 'idle', () => {
        if (this.map.getZoom() > 16) this.map.setZoom(16);
      });
    },

    fit() {
      if (!this.day) return;
      const b = new this.core.LatLngBounds();
      // 공항(JFK)은 멀어서 지도를 과도하게 넓히므로 범위 계산에서 제외.
      // 단 공항 외 방문지가 1곳 이하인 날(출국일)은 공항도 포함해야 비어 보이지 않음.
      const core = this.day.stops.filter(s => !s.airport);
      const fitStops = core.length >= 2 ? core : this.day.stops;
      fitStops.forEach(s => b.extend({ lat: s.lat, lng: s.lng }));
      (this.day.nearby || []).forEach(n => b.extend({ lat: n.lat, lng: n.lng })); // 참고 핀도 화면에 보이게
      if (state.withLodge) dayLodges(this.day).forEach(l => b.extend({ lat: l.lat, lng: l.lng }));
      const pad = mqWide.matches
        ? { top: 90, right: 80, bottom: 60, left: 80 }
        : { top: 64, right: 40, bottom: 40, left: 36 };
      this.map.fitBounds(b, pad);
      this.core.event.addListenerOnce(this.map, 'idle', () => {
        if (this.map.getZoom() > 15) this.map.setZoom(15); // 장소가 가까운 날 과확대 방지
      });
    },

    highlight(key) {
      this.marks.forEach((r, k) => {
        const on = k === key;
        r.el.classList.toggle('is-active', on);
        r.m.zIndex = on ? 999 : r.z;
      });
    },

    focus(key, { zoom }) {
      const r = this.marks.get(key);
      const info = infoFor(this.day, key);
      if (!r || !info) return;
      this.iw.setOptions({ headerContent: iwHead(info), content: iwBody(info) });
      if (zoom) {
        if (this.map.getZoom() < 15) this.map.setZoom(16);
        this.map.panTo(r.pos);
      }
      this.iw.open({ anchor: r.m, map: this.map, shouldFocus: false });
    },

    blur() { if (this.iw) this.iw.close(); },
  };

  function loadGoogleMaps() {
    return new Promise((resolve, reject) => {
      window.__nycTripMapReady = resolve;
      const params = new URLSearchParams({
        key: GOOGLE_MAPS_API_KEY,
        v: 'weekly',
        loading: 'async',
        libraries: 'marker',
        language: 'ko',
        region: 'US',
        callback: '__nycTripMapReady',
      });
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?${params}`;
      s.async = true;
      s.onerror = () => reject(new Error('Google Maps 스크립트를 불러오지 못했습니다'));
      document.head.appendChild(s);
    });
  }

  /* ------------------------------------------------------------------
   * 간이 지도 (API 키가 없거나 실패했을 때)
   * ------------------------------------------------------------------ */
  const Schematic = {
    el: $('#schematic'),
    day: null,

    init() {
      this.el.addEventListener('click', e => {
        const g = e.target.closest('[data-key]');
        select(g ? g.dataset.key : null, { fromMap: true });
      });
      if ('ResizeObserver' in window) {
        new ResizeObserver(() => { if (view === this && this.day) this.fit(); }).observe(this.el);
      }
    },

    render(day) {
      this.day = day;
      const W = this.el.clientWidth, H = this.el.clientHeight;
      if (!W || !H) return;
      const wide = mqWide.matches;
      const note = $('#mapNote');
      const noteH = note.hidden ? 0 : note.offsetHeight + (wide ? 12 : 20); // 안내 박스에 가리지 않게
      const pad = { t: 70, r: 70, b: (wide ? 60 : 50) + noteH, l: 46 };
      const lodges = dayLodges(day);
      // 공항은 멀어서 투영을 왜곡하므로, 방문지 2곳 이상이면 범위 계산에서 제외(핀은 가장자리로 클램프됨)
      const coreStops = day.stops.filter(s => !s.airport);
      const baseStops = coreStops.length >= 2 ? coreStops : day.stops;
      const withLodgePts = state.withLodge ? baseStops.concat(lodges) : baseStops;
      const fitPts = withLodgePts.concat(day.nearby || []); // 참고 핀도 화면에 들어오게

      const lat0 = fitPts.reduce((a, p) => a + p.lat, 0) / fitPts.length;
      const kx = Math.cos(lat0 * Math.PI / 180);
      const xs = fitPts.map(p => p.lng * kx), ys = fitPts.map(p => -p.lat);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const aw = Math.max(W - pad.l - pad.r, 40), ah = Math.max(H - pad.t - pad.b, 40);
      const k = Math.min(aw / Math.max(maxX - minX, 0.006), ah / Math.max(maxY - minY, 0.006));
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const P = p => [pad.l + aw / 2 + (p.lng * kx - cx) * k, pad.t + ah / 2 + (-p.lat - cy) * k];
      // 화면 밖 숙소는 가장자리에 붙이고 방향 화살표 표시
      const clamp = ([x, y]) => {
        const nx = Math.min(Math.max(x, 22), W - 22), ny = Math.min(Math.max(y, 62), H - 30 - noteH);
        const h = x > nx + .5 ? '→' : x < nx - .5 ? '←' : '';
        const v = y < ny - .5 ? '↑' : y > ny + .5 ? '↓' : '';
        const arrow = { '→↑': '↗', '→↓': '↘', '←↑': '↖', '←↓': '↙' }[h + v] || h || v;
        return [nx, ny, arrow];
      };
      const f = n => n.toFixed(1);
      const dark = isDark();
      const lineC = day.color[dark ? 1 : 0];

      // 공항 핀은 멀리 있으므로 숙소처럼 화면 가장자리로 클램프(방향 화살표). rawXY로 경로선 연결은 유지.
      const rawXY = day.stops.map(P);
      const stopXY = day.stops.map((st, i) => st.airport ? clamp(rawXY[i]) : rawXY[i]);
      const lodXY = new Map(lodges.map(l => [l.id, clamp(P(l))]));
      const label = (x, text, extra = '') => {
        const left = x > W - 130;
        return `<text class="sc-label" x="${left ? -20 : 20}" dy=".35em"${left ? ' text-anchor="end"' : ''}>${esc(text)}${extra}</text>`;
      };

      let s = `<defs><pattern id="scdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="sc-dot"/></pattern></defs>
        <rect width="100%" height="100%" class="sc-bg"/><rect width="100%" height="100%" fill="url(#scdots)"/>`;

      const dashed = (a, b) => `<path class="sc-dash" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}"/>`;
      if (day.from) s += dashed(lodXY.get(day.from.id), stopXY[0]);
      if (day.to) s += dashed(stopXY[stopXY.length - 1], lodXY.get(day.to.id));

      const d = stopXY.map((p, i) => `${i ? 'L' : 'M'}${f(p[0])} ${f(p[1])}`).join('');
      s += `<path class="sc-casing" d="${d}"/><path class="sc-route" stroke="${lineC}" d="${d}"/>`;
      for (let i = 0; i < stopXY.length - 1; i++) {
        const [x1, y1] = stopXY[i], [x2, y2] = stopXY[i + 1];
        if (Math.hypot(x2 - x1, y2 - y1) < 44) continue;
        const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        s += `<path d="M-5 -4.5L5 0L-5 4.5z" fill="${lineC}" transform="translate(${f(x1 + (x2 - x1) * .55)} ${f(y1 + (y2 - y1) * .55)}) rotate(${f(ang)})"/>`;
      }

      lodges.forEach(l => {
        const [x, y, off] = lodXY.get(l.id);
        s += `<g class="sc-mk${off ? ' is-off' : ''}" data-key="l-${l.id}" transform="translate(${f(x)} ${f(y)})">
          <g class="sc-in"><rect class="sc-lodge-box" x="-14" y="-14" width="28" height="28" rx="8"/>
          <path fill="#fff" transform="translate(-8.5 -9) scale(.72)" d="${HOUSE_PATH}"/></g>
          ${label(x, `${l.tag} · ${l.short}`, off ? ` ${off}` : '')}</g>`;
      });

      day.stops.forEach((st, i) => {
        const [x, y, off] = stopXY[i];
        const pin = st.home
          ? `<rect class="sc-lodge-box" x="-14" y="-14" width="28" height="28" rx="8"/>
             <path fill="#fff" transform="translate(-8.5 -9) scale(.72)" d="${HOUSE_PATH}"/>
             <circle cx="13" cy="-13" r="8.5" fill="${day.color[0]}" class="sc-pin"/><text class="sc-badge-num" x="13" y="-13" dy=".35em">${i + 1}</text>`
          : `<circle r="13" fill="${day.color[0]}" class="sc-pin"/><text class="sc-num" dy=".35em">${st.airport ? '✈' : (i + 1)}</text>`;
        s += `<g class="sc-mk${off ? ' is-off' : ''}" data-key="s${i}" transform="translate(${f(x)} ${f(y)})"><g class="sc-in">${pin}</g>${label(x, st.short, off ? ` ${off}` : '')}</g>`;
      });

      // "보이면 먹기" 참고 핀 — 경로선에 연결하지 않고 위치만 (점선 테두리 + 이모지)
      (day.nearby || []).forEach((nb) => {
        const [x, y, off] = clamp(P(nb));
        s += `<g class="sc-mk sc-near" transform="translate(${f(x)} ${f(y)})"><g class="sc-in"><circle r="11" class="sc-near-pin" stroke="${day.color[0]}"/><text class="sc-near-emo" dy=".35em">${nb.emoji || '📍'}</text></g>${label(x, nb.name, off ? ` ${off}` : '')}</g>`;
      });

      // 축척 막대 (오른쪽 위)
      const pxPerKm = k / 111.2;
      const nice = [20, 10, 5, 2, 1, .5, .2, .1].find(v => v * pxPerKm <= 110) || .1;
      const len = nice * pxPerKm;
      s += `<g class="sc-scale" transform="translate(${f(W - 18 - len)} 30)"><path d="M0 0v5h${f(len)}v-5"/><text x="${f(len / 2)}" y="-5">${nice < 1 ? nice * 1000 + ' m' : nice + ' km'}</text></g>`;

      this.el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${day.m}월 ${day.d}일 동선 간이 지도">${s}</svg>`;
    },

    fit() { this.render(this.day); this.highlight(state.active); },

    highlight(key) {
      this.el.querySelectorAll('[data-key]').forEach(g => g.classList.toggle('is-active', g.dataset.key === key));
    },

    focus() {}, // 간이 지도는 확대 없이 강조만
    blur() {},
  };
  Schematic.init();

  const NOTES = {
    nokey: '<b>간이 지도 미리보기</b> · <code>GOOGLE_MAPS_API_KEY</code>에 키를 넣으면 실제 Google 지도로 바뀝니다.',
    auth: '<b>Google 지도 인증 실패</b> · API 키, Maps JavaScript API 사용 설정, 결제 계정, 웹사이트 제한을 확인하세요. 지금은 간이 지도로 보여드려요.',
    error: '<b>Google 지도를 불러오지 못했어요</b> · 네트워크를 확인하세요. 지금은 간이 지도로 보여드려요.',
  };

  function useSchematic(reason) {
    $('#mapLoading').hidden = true;
    $('#mapNoteText').innerHTML = NOTES[reason] || NOTES.error;
    $('#mapNote').hidden = false;
    if (view === Schematic) return;
    GMap.clear();
    $('#gmap').hidden = true;
    Schematic.el.hidden = false;
    view = Schematic;
    Schematic.render(DAYS[state.idx]);
    Schematic.highlight(state.active);
  }
  $('#mapNoteClose').addEventListener('click', () => {
    $('#mapNote').hidden = true;
    if (view === Schematic) Schematic.fit();
  });

  // API 키가 틀렸거나 제한에 걸리면 Google이 이 함수를 호출합니다
  window.gm_authFailure = () => useSchematic('auth');

  async function startMap() {
    const key = (GOOGLE_MAPS_API_KEY || '').trim();
    if (!key || key === 'YOUR_API_KEY') { useSchematic('nokey'); return; }
    try {
      await loadGoogleMaps();
      await GMap.init($('#gmap'));
      if (view === Schematic) return; // 로드 중 인증 실패
      $('#mapLoading').hidden = true;
      view = GMap;
      GMap.render(DAYS[state.idx]);
      GMap.fit();
      refreshLegs(DAYS[state.idx]);
      loadRoutes(DAYS[state.idx]);
    } catch (err) {
      console.warn(err);
      useSchematic('error');
    }
  }

  /* ------------------------------------------------------------------
   * 시작
   * ------------------------------------------------------------------ */
  renderTabs();
  setWithLodge(state.withLodge);
  const fromHash = hashIdx();
  selectDay(fromHash >= 0 ? fromHash : Math.max(0, todayIdx()), { hash: fromHash < 0 });
  startMap();

  addEventListener('hashchange', () => {
    const i = hashIdx();
    if (i >= 0 && i !== state.idx) selectDay(i, { hash: false });
  });
  mqDark.addEventListener('change', () => {
    if (!view) return;
    view.render(DAYS[state.idx]);
    select(null);
  });
})();
</script>
</body>
</html>
